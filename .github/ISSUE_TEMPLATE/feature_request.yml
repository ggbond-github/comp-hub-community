name: ✨ Feature Request
description: Suggest an idea or improvement for comp-hub.
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape comp-hub.

        Before you start, please [search existing issues](https://github.com/ggbond-github/comp-hub-community/issues?q=is%3Aissue) — someone may have suggested this already.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: This is a feature request, not a bug report or a support question.
          required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which part of comp-hub does this concern?
      options:
        - CLI (`npx comp-hub`)
        - Local server
        - Cloud platform (teams, accounts, sign-in)
        - Web app (library, upload, settings)
        - Component preview
        - Component authoring (Vue / React)
        - Something new entirely
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation you're in today. Understanding the problem matters more than the proposed solution.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      placeholder: Describe the feature or change you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds you're using today, or other approaches you've ruled out.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Team size, workflow constraints, links, screenshots — anything that helps us judge the trade-offs.
    validations:
      required: false
